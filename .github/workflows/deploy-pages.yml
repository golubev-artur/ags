name: Публикация на GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run test
      # Адрес сайта считается от имени репозитория: golubev-artur.github.io/<repo>/
      - run: bun run build
        env:
          PAGES_BASE: /${{ github.event.repository.name }}/
      # Фото тренеров хранит Lovable: подтягиваем их в сборку (хост - превью проекта).
      - run: node scripts/fetch-lovable-assets.mjs dist/client id-preview--0e4a8802-599b-4a6a-9bb9-5189a9e88758.lovable.app
      # Pages включается один раз вручную: Settings → Pages → Source: GitHub Actions
      # (токен workflow не имеет права создать сайт Pages сам).
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
